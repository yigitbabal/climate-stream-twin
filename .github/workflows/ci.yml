name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cstwin

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests (CRDs like Workflow are skipped)
        run: |
          docker run --rm -v "$PWD/k8s:/k8s" ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -summary -ignore-missing-schemas /k8s

  e2e:
    needs: [test, manifests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cstwin:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: End-to-end run in container (synthetic data)
        run: |
          mkdir -p ci-work && chmod 777 ci-work
          run() { docker run --rm -v "$PWD/ci-work:/work" cstwin:ci "$@"; }
          run sample --days 14
          run run-all
          run report | tee ci-work/report.txt
          test "$(ls ci-work/outputs/*_capacity_factor.nc | wc -l)" -eq 2

      - name: Quality gate must stop a corrupted stream
        run: |
          mkdir -p bad-work && chmod 777 bad-work
          docker run --rm -v "$PWD/bad-work:/work" cstwin:ci sample --days 7 --corrupt
          set +e
          docker run --rm -v "$PWD/bad-work:/work" cstwin:ci run-all
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 2

      - name: Performance summary
        run: |
          echo '### Pipeline performance' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat ci-work/report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: run-metrics
          path: |
            ci-work/metrics/
            ci-work/run_report.json

      - name: Push image to GHCR (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          OWNER_IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker tag cstwin:ci "$OWNER_IMAGE:${GITHUB_SHA::7}"
          docker tag cstwin:ci "$OWNER_IMAGE:latest"
          docker push "$OWNER_IMAGE:${GITHUB_SHA::7}"
          docker push "$OWNER_IMAGE:latest"
